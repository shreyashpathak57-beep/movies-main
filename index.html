<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Premium Entertainment Hub</title><style>
    :root {
        --bg-gradient: #240033;
        --card-bg: rgba(255, 255, 255, 0.08);
        --card-border: rgba(255, 255, 255, 0.18);
        --text-primary: #ffffff;
        --text-secondary: #b3b3b3;
        --accent-glow: linear-gradient(45deg, #ff007f, #7f00ff, #00f0ff);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background: #000;
        color: var(--text-primary);
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 12px;
        position: relative;
        isolation: isolate;
    }

    /* Circular Aurora Background */
    body::before {
        content: "";
        position: fixed;
        width: 180vmax;
        height: 180vmax;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) rotate(0deg);
        transform-origin: center;
        z-index: -1;
        pointer-events: none;

        background: conic-gradient(
            from 0deg,
            #10101d,
            #191027,
            #101d30,
            #102521,
            #24121b,
            #111c35,
            #21132b,
            #10251f,
            #171020,
            #101d30,
            #10101d
        );

        filter: blur(90px);
        opacity: 0;

        animation:
            auroraReveal 1.1s ease forwards,
            auroraRotate 32s linear 0s infinite;
    }

    /* Moving circular light layer */
    body::after {
        content: "";
        position: fixed;
        width: 140vmax;
        height: 140vmax;
        left: 50%;
        top: 50%;
        z-index: -1;
        pointer-events: none;

        background:
            radial-gradient(
                ellipse at 50% 0%,
                rgba(40, 28, 65, 0.55),
                transparent 38%
            ),
            radial-gradient(
                ellipse at 100% 50%,
                rgba(15, 43, 49, 0.45),
                transparent 38%
            ),
            radial-gradient(
                ellipse at 50% 100%,
                rgba(48, 20, 35, 0.45),
                transparent 38%
            ),
            radial-gradient(
                ellipse at 0% 50%,
                rgba(20, 30, 60, 0.5),
                transparent 38%
            );

        filter: blur(75px);
        opacity: 0;

        animation:
            auroraReveal 1.1s ease forwards,
            orbitGlow 22s linear infinite;
    }

    @keyframes auroraReveal {
        from {
            opacity: 0;
        }
        to {
            opacity: 0.85;
        }
    }

    @keyframes auroraRotate {
        0% {
            rotate: 0deg;
            filter: blur(90px) hue-rotate(0deg);
        }

        25% {
            filter: blur(100px) hue-rotate(12deg);
        }

        50% {
            filter: blur(90px) hue-rotate(25deg);
        }

        75% {
            filter: blur(100px) hue-rotate(12deg);
        }

        100% {
            rotate: 360deg;
            filter: blur(90px) hue-rotate(0deg);
        }
    }

    @keyframes orbitGlow {
        0% {
            transform: translate(-50%, -50%) rotate(0deg) scale(1);
        }

        25% {
            transform: translate(-50%, -50%) rotate(90deg) scale(1.08);
        }

        50% {
            transform: translate(-50%, -50%) rotate(180deg) scale(1);
        }

        75% {
            transform: translate(-50%, -50%) rotate(270deg) scale(1.08);
        }

        100% {
            transform: translate(-50%, -50%) rotate(360deg) scale(1);
        }
    }

    header {
        text-align: center;
        padding: 10px 0;
        flex-shrink: 0;
        z-index: 1;
    }

    header h1 {
        font-size: 1.6rem;
        font-weight: 800;
        background: linear-gradient(180deg, #fff 0%, #bbb 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    header p {
        color: var(--text-secondary);
        font-size: 0.85rem;
        margin-top: 2px;
    }

    /* Full Height Grid */
    .grid-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 12px;
        width: 100%;
        flex-grow: 1;
        padding-bottom: 8px;
        z-index: 1;
    }

    .media-block {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 10px;
        cursor: pointer;
        position: relative;
        overflow: hidden;

        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s, border 0.3s;
    }

    .media-block::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--accent-glow);
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 0;
        padding: 1px;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: xor;
        -webkit-mask-composite: xor;
    }

    .media-block:hover::before {
        opacity: 0.4;
    }

    .media-block:active {
        transform: scale(0.92) translateY(2px) !important;
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .media-block:active::before {
        opacity: 1;
    }

    .block-title {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 4px;
        position: relative;
        z-index: 1;
    }

    .block-desc {
        font-size: 0.75rem;
        color: var(--text-secondary);
        padding: 0 4px;
        position: relative;
        z-index: 1;
    }

    /* Premium Animation Overlay */
    .animation-overlay {
        position: fixed;
        inset: 0;
        background: #06040a;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    .animation-overlay.active {
        opacity: 1;
        pointer-events: all;
    }

    .premium-text {
        font-size: 4.5rem;
        font-weight: 900;
        letter-spacing: 12px;
        text-transform: uppercase;
        background: var(--accent-glow);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0;
    }

    @keyframes spremium {
        0% {
            opacity: 0;
            transform: scale(0.6);
            filter: blur(10px);
            background-position: 0% center;
        }

        30% {
            opacity: 1;
            filter: blur(0px);
            transform: scale(1.05);
        }

        70% {
            opacity: 1;
            transform: scale(1);
            background-position: 200% center;
        }

        100% {
            opacity: 0;
            transform: scale(1.4);
            filter: blur(15px);
            background-position: 400% center;
        }
    }

    .animation-overlay.active .premium-text {
        animation: spremium 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Landscape / Tablet Layout */
    @media (min-width: 768px) {
        .grid-container {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }

        .premium-text {
            font-size: 6rem;
            letter-spacing: 20px;
        }
    }

    @media (max-width: 400px) {
        .premium-text {
            font-size: 2.8rem;
            letter-spacing: 6px;
        }

        .block-title {
            font-size: 1.1rem;
        }

        .block-desc {
            font-size: 0.7rem;
        }
    }
</style>

</head><body><div class="glow-orb"></div>

<script>
    document.querySelectorAll('.media-block').forEach(block => {
        block.addEventListener('click', function() {
            const stage1 = this.getAttribute('data-secure');
            const targetUrl = atob(atob(stage1));
            const overlay = document.getElementById('animationOverlay');

            overlay.classList.add('active');

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1700);
        });
    });
</script>
