<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050509">
<meta name="robots" content="noindex, nofollow">
<title>SpremiumS — Redirecting</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #050509;
    --gold: #e9d5a0;
    --white: #ffffff;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
}

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 45%,
            rgba(115, 83, 35, .17) 0%,
            rgba(29, 25, 35, .12) 30%,
            transparent 68%),
        linear-gradient(145deg, #08080e, #030305 75%);
    overflow: hidden;
}

.glow {
    position: absolute;
    width: 280px;
    height: 280px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(224, 186, 111, .10);
    filter: blur(80px);
    animation: glowPulse 3s ease-in-out infinite alternate;
}

.particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

.particle {
    position: absolute;
    bottom: -15px;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #f4dba4;
    box-shadow: 0 0 9px rgba(244, 219, 164, .8);
    opacity: 0;
    animation: floatUp linear infinite;
}

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    padding: 25px;
    text-align: center;
    animation: sceneEnter 1.1s cubic-bezier(.2,.8,.2,1) both;
}

.logo-wrap {
    position: relative;
    display: inline-block;
    padding: 18px 0;
}

.logo {
    position: relative;
    font-size: clamp(39px, 10vw, 76px);
    font-weight: 800;
    letter-spacing: clamp(2px, 1vw, 7px);
    line-height: 1.15;
    white-space: nowrap;

    background: linear-gradient(
        110deg,
        #8e7544 0%,
        #fff4d2 18%,
        #c8a96a 34%,
        #fffdf5 48%,
        #a9894c 63%,
        #fff0c5 80%,
        #947643 100%
    );

    background-size: 250% auto;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;

    filter: drop-shadow(0 0 18px rgba(226, 191, 119, .12));

    animation:
        shine 3s linear infinite,
        logoFloat 3s ease-in-out infinite;
}

.logo::after {
    content: "SpremiumS";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        180deg,
        transparent 45%,
        rgba(255, 238, 194, .15) 50%,
        transparent 55%
    );
    background-size: 100% 200%;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    pointer-events: none;
}

.underline {
    width: 0;
    height: 1px;
    margin: 13px auto 0;
    background: linear-gradient(
        90deg,
        transparent,
        #bda06a,
        #fff0c8,
        #bda06a,
        transparent
    );
    box-shadow: 0 0 12px rgba(231, 199, 135, .5);
    animation: lineReveal 1s ease-out .5s forwards;
}

.tagline {
    margin-top: 27px;
    font-size: 10px;
    letter-spacing: 5px;
    color: rgba(255, 255, 255, .53);
    text-transform: uppercase;
    animation: fadeUp 1s ease-out .55s both;
}

.status {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    margin-top: 48px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .65);
    animation: fadeUp 1s ease-out .8s both;
}

.dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #e9d5a0;
    box-shadow: 0 0 10px #e9d5a0;
    animation: blink 1s ease-in-out infinite;
}

.progress {
    width: min(190px, 65vw);
    height: 2px;
    background: rgba(255, 255, 255, .09);
    margin: 19px auto 0;
    overflow: hidden;
    border-radius: 10px;
    animation: fadeUp .8s ease-out 1s both;
}

.progress-bar {
    width: 0;
    height: 100%;
    background: linear-gradient(90deg, #92713d, #fff0c8, #b39155);
    box-shadow: 0 0 12px rgba(233, 213, 160, .6);
    animation: progressFill 2s linear forwards;
}

.fallback {
    margin-top: 24px;
    font-size: 11px;
    color: rgba(255, 255, 255, .42);
    animation: fadeUp 1s ease-out 1s both;
}

.fallback a {
    color: #e9d5a0;
    text-decoration: none;
    border-bottom: 1px solid rgba(233, 213, 160, .45);
    padding-bottom: 2px;
}

.corner {
    position: fixed;
    width: 25px;
    height: 25px;
    opacity: .35;
}

.top-left {
    top: 22px;
    left: 22px;
    border-top: 1px solid #bba06d;
    border-left: 1px solid #bba06d;
}

.top-right {
    top: 22px;
    right: 22px;
    border-top: 1px solid #bba06d;
    border-right: 1px solid #bba06d;
}

.bottom-left {
    bottom: 22px;
    left: 22px;
    border-bottom: 1px solid #bba06d;
    border-left: 1px solid #bba06d;
}

.bottom-right {
    bottom: 22px;
    right: 22px;
    border-bottom: 1px solid #bba06d;
    border-right: 1px solid #bba06d;
}

@keyframes sceneEnter {
    from {
        opacity: 0;
        transform: translateY(16px) scale(.97);
        filter: blur(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

@keyframes shine {
    from { background-position: 100% center; }
    to { background-position: -150% center; }
}

@keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
}

@keyframes glowPulse {
    from { opacity: .55; transform: translate(-50%, -50%) scale(.85); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
}

@keyframes lineReveal {
    to { width: min(260px, 70vw); }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes blink {
    0%, 100% { opacity: .35; }
    50% { opacity: 1; }
}

@keyframes progressFill {
    from { width: 0; }
    to { width: 100%; }
}

@keyframes floatUp {
    0% {
        transform: translateY(0);
        opacity: 0;
    }
    10% { opacity: .7; }
    90% { opacity: .3; }
    100% {
        transform: translateY(-105vh);
        opacity: 0;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="glow"></div>
    <div class="particles" id="particles"></div>
</div>

<div class="corner top-left"></div>
<div class="corner top-right"></div>
<div class="corner bottom-left"></div>
<div class="corner bottom-right"></div>

<main class="container">
    <div class="logo-wrap">
        <div class="logo">SpremiumS</div>
        <div class="underline"></div>
    </div>

    <div class="tagline">The Premium Experience</div>

    <div class="status">
        <span class="dot"></span>
        <span>Preparing your experience</span>
    </div>

    <div class="progress">
        <div class="progress-bar"></div>
    </div>

    <div class="fallback">
        Not redirected?
        <a id="manualLink" href="#">Continue manually ↗</a>
    </div>
</main>

<script>
(function () {
    "use strict";

    // CHANGE THIS TO YOUR DESTINATION
    const DESTINATION = "https://spremiums.gt.tc/lux/";

    const REDIRECT_DELAY = 2000;

    // Update the manual fallback link.
    const manualLink = document.getElementById("manualLink");
    manualLink.href = DESTINATION;

    // Generate lightweight decorative particles.
    const particles = document.getElementById("particles");
    const count = window.innerWidth < 600 ? 18 : 32;
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < count; i++) {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.animationDuration =
            (5 + Math.random() * 8) + "s";
        particle.style.animationDelay =
            (Math.random() * 6) + "s";
        particle.style.opacity = "0";
        fragment.appendChild(particle);
    }

    particles.appendChild(fragment);

    // Schedule redirect once; the visible link remains a fallback.
    window.setTimeout(function () {
        window.location.replace(DESTINATION);
    }, REDIRECT_DELAY);
})();
</script>

</body>
</html>
