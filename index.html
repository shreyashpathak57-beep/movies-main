<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Update Available</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top left, #1e293b, #090d16);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .update-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                  0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      overflow: hidden;
    }

    /* Subtle top glow accent */
    .update-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, #818cf8, transparent);
    }

    /* Status Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 1; }
      70% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .meta {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .meta span {
      color: #cbd5e1;
      font-weight: 500;
    }

    /* What's New Section */
    .changelog-box {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 26px;
    }

    .changelog-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #cbd5e1;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .changelog-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .changelog-list li {
      position: relative;
      padding-left: 22px;
      font-size: 14px;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .changelog-list li::before {
      content: '✓';
      position: absolute;
      left: 0;
      top: 0;
      color: #34d399;
      font-weight: 700;
    }

    /* Premium Update Button */
    .update-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 24px;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
      transition: all 0.25s ease;
    }

    .update-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -5px rgba(99, 102, 241, 0.65);
      filter: brightness(1.08);
    }

    .update-btn:active {
      transform: translateY(0);
    }

    .update-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.25s ease;
    }

    .update-btn:hover svg {
      transform: translateY(2px);
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="update-card">
    <div class="badge">
      <span class="pulse-dot"></span>
      Update Available !
    </div>

    <h1 class="title">New Version Ready</h1>
    <p class="meta">Version <span>v1.0.0</span> &bull; Android APK</p>

    <div class="changelog-box">
      <div class="changelog-title">✨ What's New</div>
      <ul class="changelog-list">
        <li>Faster app startup and smoother animations</li>
        <li>Brand new dark mode interface improvements</li>
        <li>Fixed minor bugs and enhanced overall stability</li>
      </ul>
    </div>

      </svg>
      Update Now

    <p class="footer-note">Direct &amp; safe download via GitHub Releases</p>
  </div>

</body>
</html>
