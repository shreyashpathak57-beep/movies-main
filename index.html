<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050509">
<title>SpremiumS</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    display: grid;
    place-items: center;
    background: #050509;
    color: #f5e3b5;
    font-family: Arial, sans-serif;
}

.content {
    text-align: center;
    animation: enter 0.3s ease-out both;
}

.logo {
    font-size: clamp(38px, 10vw, 64px);
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(
        100deg,
        #8e7040,
        #fff4d1,
        #c9a65f,
        #fff9e9
    );
    background-size: 200% auto;
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
    animation: shine 0.5s linear;
}

.status {
    margin-top: 15px;
    color: #99949a;
    font-size: 11px;
    letter-spacing: 3px;
}

.fallback {
    margin-top: 24px;
    font-size: 12px;
}

a {
    color: #f5e3b5;
}

@keyframes enter {
    from {
        opacity: 0;
        transform: scale(.94);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes shine {
    from { background-position: 100% center; }
    to { background-position: -100% center; }
}
</style>
</head>

<body>
<main class="content">
    <div class="logo">SpremiumS</div>
    <div class="status">ENTERING PREMIUM EXPERIENCE</div>
    <div class="fallback">
        <a href="https://spremiums.gt.tc/lux/">Continue now ↗</a>
    </div>
</main>

<script>
(function () {
    "use strict";

    var destination = "https://spremiums.gt.tc/lux/";
    var redirected = false;

    function redirect() {
        if (redirected) return;
        redirected = true;
        window.location.replace(destination);
    }

    // Brief animation, then redirect.
    window.setTimeout(redirect, 300);

    // Keep the redirect available if the timer is delayed.
    window.setTimeout(redirect, 700);
})();
</script>
</body>
</html>
